name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist/ is committed so `npm i -g github:haszno-labs/...` works without a build step.
      - name: dist/ is up to date
        run: git diff --exit-code -- dist || (echo "::error::Run npm run build and commit dist/" && exit 1)
